<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://world.openfoodfacts.org; worker-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143f35" />
    <meta
      name="description"
      content="Understand your nutrition, with clear evidence and a private local food journal."
    />
    <title>Nutrak · Nutrition, understood</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="./icons/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nutrak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#/today"
          ><span class="brand-icon">n<span>·</span></span
          >nutrak</a
        >
        <p class="brand-caption">NUTRITION, UNDERSTOOD.</p>
        <nav aria-label="Main navigation">
          <a href="#/today" data-nav="today"><span>◉</span>Overview</a
          ><a href="#/log" data-nav="log"><span>＋</span>Food journal</a
          ><a href="#/adequacy" data-nav="adequacy"
            ><span>▥</span>Patterns & evidence</a
          ><a href="#/profile" data-nav="profile"><span>◎</span>Your profile</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="local-dot">On your device</div>
          <p>Your journal stays in this browser. You choose what leaves it.</p>
          <button class="text-button" id="sourcesButton">
            Science & sources ↗
          </button>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <header class="topbar">
          <span class="eyebrow">YOUR PERSONAL NUTRITION JOURNAL</span
          ><button class="subtle" id="privacyButton">◈ Local first</button>
        </header>
        <div id="storageNotice" class="notice error" role="alert" hidden></div>
        <section id="screen-today" class="screen"></section>
        <section id="screen-log" class="screen" hidden></section>
        <section id="screen-adequacy" class="screen" hidden></section>
        <section id="screen-profile" class="screen" hidden></section>
        <footer>
          Built for understanding. Estimates are a starting point, not a
          diagnosis.<button class="text-button" id="footerSources">
            Read our approach ↗
          </button>
        </footer>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="infoDialog">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button id="closeDialog" aria-label="Close dialog">✕</button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <script src="./src/reference-data.js"></script>
    <script src="./src/engine.js"></script>
    <script src="./src/foods.js"></script>
    <script src="./src/photo.js"></script>
    <script src="./src/store.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
